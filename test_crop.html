
<!DOCTYPE html>
<html>
<head>
<style>
.box {
    width: 188px;
    height: 145px;
    position: relative;
    overflow: hidden;
    border: 2px solid gold;
    background: #1e293b;
    margin: 10px;
    display: inline-block;
}
.img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 12%;
    transform: scale(1.35);
    transform-origin: center 22%;
}
</style>
</head>
<body>
<div class='box'><img class='img' src='https://resources.premierleague.com/premierleague25/photos/players/500x500/513418.png'></div>
<div class='box'><img class='img' src='https://resources.premierleague.com/premierleague25/photos/players/500x500/223094.png'></div>
<div class='box'><img class='img' src='https://resources.premierleague.com/premierleague25/photos/players/500x500/475168.png'></div>
<div class='box'><img class='img' src='https://resources.premierleague.com/premierleague/photos/players/250x250/p154043.png'></div>
</body>
</html>
